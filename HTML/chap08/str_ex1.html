<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="test">A bad workman always blames his tools.</p>
    <p id="index"></p>
    <button onclick="myFun()">workman의 인덱스 찾기</button>
    <script>
        function myFun() {
            let text = document.getElementById("test").innerHTML;
            document.getElementById("index").innerHTML = 
            text.indexOf("workman");
        }
    </script>
</body>
</html>
